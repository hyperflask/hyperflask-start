services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace
{%- if cookiecutter.agent == "claude" %}
      # Claude Code credentials and settings from the host
      - ${HOME}/.claude:/home/pn/.claude
      - ${HOME}/.claude.json:/home/pn/.claude.json
{%- elif cookiecutter.agent == "codex" %}
      # Codex credentials and settings from the host
      - ${HOME}/.codex:/home/pn/.codex
{%- elif cookiecutter.agent == "opencode" %}
      # OpenCode credentials and settings from the host
      - ${HOME}/.config/opencode:/home/pn/.config/opencode
      - ${HOME}/.local/share/opencode:/home/pn/.local/share/opencode
{%- endif %}
    command: sleep infinity
    environment:
      FLASK_MAIL_BACKEND: smtp
      FLASK_MAIL_SERVER: mailpit
      FLASK_MAIL_PORT: 1025
      # FLASK_DRAMATIQ_BROKER_URL: redis://valkey:6379/0
      # FLASK_SQLORM_DATABASE_URI: postgresql://user:password@postgres:5432/user
    # depends_on:
    #   - postgres
    #   - valkey

  mailpit: # email testing tool
    image: axllent/mailpit
    ports:
      - "8025:8025"

